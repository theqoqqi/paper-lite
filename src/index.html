<!DOCTYPE html>
<html lang='ru'>
    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <title>Хроники Клетчатой Бездны</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: monospace;
            }

            body {
                background: #121212;
                color: #e0e0e0;
                padding: 8px;
                display: flex;
                justify-content: center;
            }

            #app {
                position: relative;
                width: 100%;
                max-width: 480px;
                background: #1a1a1a;
                border: 1px solid #333;
                border-radius: 8px;
                padding: 12px;
                min-height: 95vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            h1 {
                font-size: 18px;
                text-align: center;
                margin-bottom: 12px;
                color: #ffca28;
            }

            h2, h3 {
                text-align: center;
                margin-bottom: 10px;
                color: #fff;
            }

            h4 {
                margin: 8px 0 4px 0;
                color: #ffca28;
                font-size: 13px;
            }

            button {
                background: #2c2c2c;
                color: #f0f0f0;
                border: 1px solid #555;
                padding: 10px;
                border-radius: 5px;
                width: 100%;
                margin: 4px 0;
                font-size: 13px;
                cursor: pointer;
                text-align: left;
            }

            button:active:not(:disabled) {
                background: #3f3f3f;
            }

            button:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .btn-center {
                text-align: center;
            }

            .btn-primary {
                background: #264653;
                border-color: #2a9d8f;
                font-weight: bold;
            }

            .btn-danger {
                background: #4a2020;
                border-color: #883333;
            }

            .panel {
                position: relative;
                background: #242424;
                padding: 10px;
                border-radius: 5px;
                margin-bottom: 10px;
                font-size: 13px;
                border: 1px solid #333;
            }

            .text-center {
                text-align: center;
            }

            .stats-line {
                display: flex;
                justify-content: space-between;
                margin-bottom: 3px;
                align-items: center;
            }

            .equip-line {
                font-size: 11px;
                color: #aaa;
                margin-top: 4px;
                border-top: 1px dashed #3a3a3a;
                padding-top: 4px;
            }

            .flex-row {
                display: flex;
                gap: 6px;
            }

            .map-grid {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                grid-auto-rows: 1fr;
                gap: 10px;
                margin-bottom: 12px;
                aspect-ratio: 1;
                width: 100%;
            }

            .map-cell {
                position: relative;
                overflow: hidden;
                min-height: 0;
                min-width: 0;
            }

            .map-node {
                background: #262626;
                padding: 8px 4px;
                text-align: center;
                border-radius: 4px;
                font-size: 12px;
                border: 1px solid #444;
                cursor: pointer;
            }

            .map-node.active {
                border: 2px solid #ff9800;
                background: #3a2e1e;
                font-weight: bold;
            }

            .map-node.done {
                opacity: 0.25;
                cursor: default;
            }

            .enemy-card {
                position: relative;
                padding: 0;
                margin-bottom: 6px;
                cursor: pointer;
                display: flex;
                align-items: stretch;
            }

            .enemy-card.selected .enemy-info {
                background: #322222;
                border-color: #ef5350;
            }

            .enemy-card.boss {
                flex-direction: column;
                background: #252525;
                border: 1px solid #444;
                border-radius: 6px;
                overflow: hidden;
            }

            .enemy-card.boss.selected {
                border-color: #ef5350;
            }

            .enemy-card.boss .enemy-banner {
                width: 100%;
                aspect-ratio: 16 / 9;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-color: #151515;
                border-bottom: 1px solid #444;
            }

            .enemy-card.boss.selected .enemy-banner {
                border-bottom-color: #ef5350;
            }

            .enemy-card.boss .enemy-info {
                border: none;
                border-radius: 0;
                padding: 8px 12px;
                background: transparent;
            }

            .enemy-card.boss.selected .enemy-info {
                background: #322222;
                border: none;
            }

            .enemy-sprite {
                width: 64px;
                height: 64px;
                box-sizing: content-box;
                flex-shrink: 0;
                background-repeat: no-repeat;
                image-rendering: pixelated;
                background-color: #151515;
                border: 1px solid #444;
                border-right: none;
                border-radius: 6px 0 0 6px;
            }

            .enemy-sprite.elite {
                width: 128px;
                height: 128px;
            }

            .enemy-sprite-fallback {
                width: 64px;
                height: 64px;
                box-sizing: content-box;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 28px;
                background: #151515;
                border: 1px solid #444;
                border-right: none;
                border-radius: 6px 0 0 6px;
            }

            .enemy-sprite-fallback.elite {
                width: 128px;
                height: 128px;
                font-size: 40px;
            }

            .enemy-info {
                flex: 1;
                min-width: 0;
                padding: 6px 10px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                background: #252525;
                border: 1px solid #444;
                border-radius: 0 6px 6px 0;
            }

            .enemy-badge {
                font-size: 10px;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 2px;
                line-height: 1.2;
            }

            .enemy-badge.elite {
                color: #ef5350;
            }

            .enemy-badge.boss {
                color: #ffca28;
            }

            .enemy-name {
                font-weight: bold;
                font-size: 13px;
                line-height: 1.2;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .enemy-stats {
                font-size: 12px;
                line-height: 1.2;
                color: #e0e0e0;
                margin-top: 3px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .stat-divider {
                display: inline-block;
                width: 1px;
                height: 10px;
                background: #555;
                margin: 0 6px;
                vertical-align: middle;
            }

            .enemy-intent {
                font-size: 12px;
                line-height: 1.2;
                color: #ffb74d;
                margin-top: 3px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .enemy-card.elite .enemy-name,
            .enemy-card.boss .enemy-name {
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
            }

            .enemy-card.elite .enemy-intent,
            .enemy-card.boss .enemy-intent {
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                line-height: 1.3;
            }

            .log {
                background: #101010;
                padding: 8px;
                height: 130px;
                overflow-y: auto;
                font-size: 12px;
                border: 1px solid #2a2a2a;
                margin-top: 8px;
                border-radius: 4px;
                line-height: 1.4;
            }

            .modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.85);
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 12px;
                z-index: 100;
            }

            .modal-box {
                background: #1e1e1e;
                padding: 14px;
                border-radius: 8px;
                width: 100%;
                max-width: 440px;
                max-height: 90vh;
                border: 1px solid #555;
                display: flex;
                flex-direction: column;
            }

            .modal-scroll {
                overflow-y: auto;
                max-height: 70vh;
                padding-right: 4px;
            }

            textarea {
                width: 100%;
                height: 80px;
                background: #0d0d0d;
                color: #66bb6a;
                border: 1px solid #444;
                padding: 6px;
                font-size: 11px;
                margin-bottom: 4px;
                border-radius: 4px;
            }

            #fx-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                overflow: hidden;
                z-index: 50;
            }

            .fx-row {
                position: absolute;
                transform: translate(-50%, -50%);
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 6px;
                pointer-events: none;
                white-space: nowrap;
                user-select: none;
                animation: fx-row-float-up 1100ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            .fx-badge {
                font-family: inherit;
                font-weight: 900;
                text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.9);
                animation: fx-badge-pop 160ms cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
                pointer-events: none;
                white-space: nowrap;
                user-select: none;
            }

            .fx-badge.damage {
                color: #ff5252;
                font-size: 20px;
            }

            .fx-badge.crit {
                color: #ffd700;
                font-size: 24px;
                letter-spacing: 1px;
            }

            .fx-badge.shield {
                color: #4fc3f7;
                font-size: 18px;
            }

            .fx-badge.heal {
                color: #69f0ae;
                font-size: 20px;
            }

            .fx-badge.poison {
                color: #b2ff59;
                font-size: 18px;
            }

            .fx-badge.poisonDamage {
                color: #76ff03;
                font-size: 19px;
            }

            .fx-badge.bleed {
                color: #ff5252;
                font-size: 18px;
            }

            .fx-badge.bleedDamage {
                color: #ff1744;
                font-size: 19px;
            }

            .fx-badge.spikesDamage {
                color: #e0e050;
                font-size: 19px;
            }

            @keyframes fx-row-float-up {
                0% {
                    transform: translate(-50%, calc(-50% + 10px)) scale(0.85);
                    opacity: 0;
                }
                12% {
                    transform: translate(-50%, calc(-50% - 6px)) scale(1);
                    opacity: 1;
                }
                25% {
                    transform: translate(-50%, calc(-50% - 14px)) scale(1);
                    opacity: 1;
                }
                75% {
                    transform: translate(-50%, calc(-50% - 32px)) scale(1);
                    opacity: 0.95;
                }
                100% {
                    transform: translate(-50%, calc(-50% - 48px)) scale(0.92);
                    opacity: 0;
                }
            }

            @keyframes fx-badge-pop {
                0% {
                    transform: scale(0.5);
                    opacity: 0;
                }
                70% {
                    transform: scale(1.15);
                    opacity: 1;
                }
                100% {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            .enemy-card.dying {
                pointer-events: none;
                animation: enemy-death 500ms ease-out forwards;
            }

            @keyframes enemy-death {
                0% {
                    transform: scale(1);
                    opacity: 1;
                    filter: brightness(1.6);
                }
                25% {
                    transform: scale(1.03) translateY(-3px);
                    opacity: 0.95;
                    filter: brightness(1.1) contrast(1.2);
                }
                60% {
                    transform: scale(0.95) translateY(4px);
                    opacity: 0.6;
                    filter: grayscale(0.8) brightness(0.4);
                }
                100% {
                    transform: scale(0.8) translateY(12px);
                    opacity: 0;
                    filter: grayscale(1) brightness(0.1);
                }
            }

            .anim-shake {
                animation: fx-shake 260ms ease-in-out;
            }

            .anim-crit-shake {
                animation: fx-crit-shake 320ms ease-in-out;
            }

            @keyframes fx-shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-5px); }
                40% { transform: translateX(5px); }
                60% { transform: translateX(-3px); }
                80% { transform: translateX(3px); }
            }

            @keyframes fx-crit-shake {
                0%, 100% { transform: translate(0, 0); }
                15% { transform: translate(-7px, -2px); }
                30% { transform: translate(6px, 2px); }
                45% { transform: translate(-5px, 1px); }
                60% { transform: translate(4px, -1px); }
                75% { transform: translate(-2px, 0); }
            }
        </style>
    </head>
    <body>

        <div id='app'>
            <div id='screen-container'></div>
            <div id='fx-overlay'></div>
            <div id='global-nav' style='margin-top: 10px; border-top: 1px solid #333; padding-top: 8px;'></div>
        </div>

        <script type='module' src='main.js'></script>
    </body>
</html>
